[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqpack"
version = "0.1.0"
description = "Memetic evolutionary search for packing N unit squares (rotation allowed) into the smallest square, with visualisations of the evolution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "numba>=0.60",
    "matplotlib>=3.8",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sqpack = "sqpack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sqpack = ["viz/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
